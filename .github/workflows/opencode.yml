name: OpenCode
run-name: "OpenCode #${{ github.event.issue.number || inputs.issue_number }}${{ github.event.issue.title && format(' — {0}', github.event.issue.title) || '' }}"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue to run
        required: true
        type: string

permissions: {}

concurrency:
  group: opencode-issue-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'OpenCode'))
    permissions:
      contents: write
      id-token: write
      issues: write
      actions: write
    uses: denaidark/OhMyGithub/.github/workflows/opencode-prepare.yml@6f6d1b7b9bdb480e4ef1c32fd5b0fca8814a9003
    with:
      runtime_ref: 6f6d1b7b9bdb480e4ef1c32fd5b0fca8814a9003

  sanitize-labels:
    needs: prepare
    if: needs.prepare.outputs.approved == 'true'
    runs-on: ubuntu-latest
    outputs:
      labels_json: ${{ steps.clean.outputs.labels_json }}
    steps:
      - name: Strip unstable networking labels before dispatch
        id: clean
        shell: bash
        env:
          RAW_LABELS_JSON: ${{ needs.prepare.outputs.labels_json }}
        run: |
          set -euo pipefail
          sanitized="$(node --input-type=module <<'NODE'
          const labels = JSON.parse(process.env.RAW_LABELS_JSON || '[]');
          const blocked = new Set(['warp', 'proxy']);
          const cleaned = labels.filter((label) => !blocked.has(String(label).trim().toLowerCase()));
          process.stdout.write(JSON.stringify(cleaned));
          NODE
          )"
          printf 'labels_json=%s\n' "$sanitized" >> "$GITHUB_OUTPUT"

  opencode:
    needs: [prepare, sanitize-labels]
    if: needs.prepare.outputs.approved == 'true' && needs.sanitize-labels.result == 'success'
    permissions:
      contents: write
      id-token: write
      issues: write
      actions: read
      pull-requests: write
    uses: denaidark/OhMyGithub/.github/workflows/opencode-reusable.yml@6f6d1b7b9bdb480e4ef1c32fd5b0fca8814a9003
    with:
      runtime_ref: 6f6d1b7b9bdb480e4ef1c32fd5b0fca8814a9003
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      request: ${{ needs.prepare.outputs.request }}
      issue_title: ${{ needs.prepare.outputs.issue_title }}
      labels_json: ${{ needs.sanitize-labels.outputs.labels_json }}
      sender: ${{ needs.prepare.outputs.sender }}
      target_ref: ${{ needs.prepare.outputs.target_ref }}
      target_sha: ${{ needs.prepare.outputs.target_sha }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
      AGENTSWEB_SSH_PUBLIC_KEY: ${{ secrets.AGENTSWEB_SSH_PUBLIC_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
