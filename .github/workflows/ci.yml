name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# A new push to the same branch cancels the previous run. Autonomy work is
# branch-heavy; there is no value in testing three commits when only the last one
# is going to deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: v1-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            v1-node-modules-${{ runner.os }}-

      - name: Save node_modules cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: node_modules
          key: v1-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npx prettier --check "src/**/*.{ts,tsx}" "scripts/**/*.mjs" vercel.json wrangler.jsonc .prettierrc

      - name: Test
        run: npm test

      # The one that matters: boots a real office on a real embedded Postgres
      # and asserts that the agents actually act, stay inside their roles, and
      # never double-book money. If autonomy breaks, autonomy CI fails.
      - name: Verify the office runs autonomously
        run: npm run verify:office

      - name: Production build
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The most likely place for a credential to leak is a file that should
      # never have been committed at all.
      - name: Fail on committed secrets
        run: |
          if git ls-files | grep -E '\.env$|\.env\.local$|\.grok/|\.pem$|id_rsa' ; then
            echo "::error::A credential-bearing file is tracked in git."
            exit 1
          fi
          echo "No credential files are tracked."

      - name: Fail on committed local database state
        run: |
          if git ls-files | grep -q '\.wrangler/'; then
            echo "::error::Machine-local miniflare state is tracked in git."
            exit 1
          fi
          echo "No local database state is tracked."
