name: Deploy vantage-ars Worker

on:
  push:
    branches:
      - main
      - master
    paths:
      - "workers/vantage-ars/**"
      # A change to this workflow is itself a reason to redeploy, so a fixed
      # workflow applies its fix to the Worker instead of waiting for the next
      # workers/** commit.
      - ".github/workflows/deploy-vantage-ars.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install --no-save wrangler@4

      # wrangler resolves --file against the working directory, not the config
      # file, so both SQL paths must be repository-relative.
      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 d1 execute vantage-data --config workers/vantage-ars/wrangler.toml --remote --file=workers/vantage-ars/schema.sql --yes

      - name: Seed D1 data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 d1 execute vantage-data --config workers/vantage-ars/wrangler.toml --remote --file=workers/vantage-ars/seed.sql --yes

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 deploy --config workers/vantage-ars/wrangler.toml --minify
