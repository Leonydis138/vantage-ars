openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Vantage ARS operations and approval API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vantage-ars
    description: Owner-approved Vantage ARS operations using connected live services
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /vantage-ars/dashboard:
    get:
      operationId: getVantageArsDashboard
      tags: [vantage-ars]
      summary: Read live service health and operational counts
      responses:
        "200":
          description: Dashboard status from connected services and persisted records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/inquiries:
    get:
      operationId: listVantageArsInquiries
      tags: [vantage-ars]
      summary: List real enquiries imported from Gmail
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, processing, needs_review, needs_information, quote_ready, quote_sent, reply_received, accepted, declined, not_relevant, archived]
            default: all
        - name: escalated
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Persisted enquiries and any generated quote proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VantageInquiry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/autonomous/run:
    post:
      operationId: runVantageArsAutonomousCycle
      tags: [vantage-ars]
      summary: Run the full autonomous operations cycle
      responses:
        "200":
          description: Autonomous cycle result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  steps:
                    type: array
                    items:
                      $ref: "#/components/schemas/VantageAutonomousStep"
                required: [message, steps]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/inquiries/sync:
    post:
      operationId: syncVantageArsInquiries
      tags: [vantage-ars]
      summary: Read matching live Gmail messages and process them with Grok
      description: >
        Imports only matching inbox messages. It never sends email, creates a
        Gmail draft, or publishes content.
      responses:
        "200":
          description: Live Gmail sync and AI processing results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageSyncResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: A connected provider returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/export:
    get:
      operationId: exportVantageArsInquiries
      tags: [vantage-ars]
      summary: Export filtered enquiries as CSV
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: all
            enum: [all, processing, needs_review, needs_information, quote_ready, quote_sent, reply_received, accepted, declined, not_relevant, archived]
        - name: escalated
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/audit-events:
    get:
      operationId: listVantageArsAuditEvents
      tags: [vantage-ars]
      summary: Read the owner action audit trail
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Recent audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VantageAuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/metrics:
    get:
      operationId: getVantageArsMetrics
      tags: [vantage-ars]
      summary: Read autonomous operations metrics
      responses:
        "200":
          description: Autonomous performance metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageAutonomousMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/automation/bank-details:
    put:
      operationId: setVantageArsAutomationBankDetails
      tags: [vantage-ars]
      summary: Configure default bank details for autonomous quote sending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VantageAutomationBankDetailsInput"
      responses:
        "200":
          description: Updated automation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageAutomationSettings"
        "400":
          description: Banking information is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/automation/policy:
    put:
      operationId: setVantageArsAutomationPolicy
      tags: [vantage-ars]
      summary: Configure autonomy timing and scheduling policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VantageAutonomyPolicyInput"
      responses:
        "200":
          description: Updated automation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageAutomationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/automation/runs:
    get:
      operationId: listVantageArsAutomationRuns
      tags: [vantage-ars]
      summary: Read recent autonomous cycle runs
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent automation runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VantageAutomationRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/automation/policy/test-webhook:
    post:
      operationId: testVantageArsAutomationWebhook
      tags: [vantage-ars]
      summary: Send a test payload to the configured notification webhook
      responses:
        "200":
          description: Test delivery result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: Webhook delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/automation:
    get:
      operationId: getVantageArsAutomation
      tags: [vantage-ars]
      summary: Read automated inbox processing settings
      responses:
        "200":
          description: Current processing preference and polling interval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageAutomationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setVantageArsAutomation
      tags: [vantage-ars]
      summary: Enable or pause automated inbox processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VantageAutomationInput"
      responses:
        "200":
          description: Updated processing preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageAutomationSettings"
        "400":
          description: Grok or Gmail is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/inquiries/{inquiryId}:
    get:
      operationId: getVantageArsInquiry
      tags: [vantage-ars]
      summary: Read one enquiry
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Persisted enquiry and any generated quote proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageInquiry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/inquiries/{inquiryId}/crm-sync:
    post:
      operationId: syncVantageArsInquiryToHubSpot
      tags: [vantage-ars]
      summary: Retry the approved inquiry contact sync to HubSpot
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: HubSpot contact sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageCrmSyncResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "502":
          description: HubSpot could not confirm the contact update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/inquiries/{inquiryId}/accept:
    post:
      operationId: acceptVantageArsQuote
      tags: [vantage-ars]
      summary: Mark a sent quote as accepted by the customer
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageQuoteDecisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "409":
          description: Quote is not in a sent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/inquiries/{inquiryId}/reprocess:
    post:
      operationId: reprocessVantageArsInquiry
      tags: [vantage-ars]
      summary: Re-run Grok triage for an enquiry
      description: >
        Re-reads the stored enquiry text and regenerates the AI review or quote
        proposal. Does not send email, write to HubSpot, or change customer data.
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reprocessing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageReprocessResult"
        "400":
          description: Enquiry cannot be reprocessed from its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/inquiries/{inquiryId}/preview:
    post:
      operationId: previewVantageArsQuote
      tags: [vantage-ars]
      summary: Preview the exact quote email without sending it
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VantageQuotePreviewInput"
      responses:
        "200":
          description: Exact recipient, subject, and rendered message for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageQuotePreview"
        "400":
          description: Quote is not ready or banking information is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/inquiries/{inquiryId}/decision:
    post:
      operationId: decideVantageArsQuote
      tags: [vantage-ars]
      summary: Approve and send, or decline, an AI-prepared quote
      description: >
        An approval sends the quote to the inquiry's stored sender address
        through Gmail. Bank details are accepted for this request only and are
        never persisted by the application.
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VantageQuoteDecisionInput"
      responses:
        "200":
          description: Quote decision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageQuoteDecisionResult"
        "400":
          description: Quote is incomplete or not eligible for the requested action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "502":
          description: Gmail could not confirm the send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
components:
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VantageError"
    Unauthorized:
      description: Sign-in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VantageError"
    Forbidden:
      description: This account is not the connected business mailbox owner
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VantageError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VantageServiceStatus:
      type: object
      properties:
        id:
          type: string
          enum: [gmail, grok, hubspot, cloudflare, phone, facebook, linkedin]
        label:
          type: string
        status:
          type: string
          enum: [connected, attention, not_connected, setup_required]
        detail:
          type: string
      required: [id, label, status, detail]
    VantageDashboard:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/VantageServiceStatus"
        counts:
          type: object
          properties:
            needsReview:
              type: integer
            needsInformation:
              type: integer
            quotesReady:
              type: integer
            replyReceived:
              type: integer
            quotesSent:
              type: integer
            crmSyncNeeded:
              type: integer
          required: [needsReview, needsInformation, replyReceived, quotesReady, quotesSent, crmSyncNeeded]
        lastSyncAt:
          type: [string, "null"]
          format: date-time
        rateSourceUrl:
          type: string
      required: [services, counts, lastSyncAt, rateSourceUrl]
    VantageRateLine:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitPrice:
          type: number
        total:
          type: number
      required: [code, description, quantity, unit, unitPrice, total]
    VantageQuote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        status:
          type: string
          enum: [ready, sending, sent, accepted, declined, send_uncertain]
        currency:
          type: string
          enum: [ZAR]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/VantageRateLine"
        subtotal:
          type: number
        notes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: [string, "null"]
      required: [id, reference, status, currency, lines, subtotal, notes, createdAt, sentAt]
    VantageInquiry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
        subject:
          type: string
        receivedAt:
          type: string
          format: date-time
        summary:
          type: [string, "null"]
        category:
          type: [string, "null"]
        urgency:
          type: [string, "null"]
        sentiment:
          type: [string, "null"]
        tags:
          type: array
          items:
            type: string
        language:
          type: [string, "null"]
        priorityScore:
          type: integer
        aiConfidence:
          type: [number, "null"]
        clarificationSentAt:
          type: [string, "null"]
          format: date-time
        resolutionAttemptedAt:
          type: [string, "null"]
          format: date-time
        escalatedAt:
          type: [string, "null"]
          format: date-time
        followUpSentAt:
          type: [string, "null"]
          format: date-time
        schedulingEmailSentAt:
          type: [string, "null"]
          format: date-time
        acceptedAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [processing, needs_review, needs_information, quote_ready, quote_sent, reply_received, accepted, declined, not_relevant, archived]
        missingInformation:
          type: array
          items:
            type: string
        messageBody:
          type: string
        hasAttachments:
          type: boolean
        hubspotContactId:
          type: [string, "null"]
        hubspotSyncStatus:
          type: string
          enum: [not_requested, pending, synced, needs_attention]
        quote:
          oneOf:
            - $ref: "#/components/schemas/VantageQuote"
            - type: "null"
      required:
        [id, customerName, customerEmail, subject, receivedAt, summary, category, urgency, status, missingInformation, messageBody, hasAttachments, hubspotContactId, hubspotSyncStatus, quote]
    VantageAutonomousMetrics:
      type: object
      properties:
        totalInquiries:
          type: integer
        escalatedInquiries:
          type: integer
        resolvedInquiries:
          type: integer
        solutionPatterns:
          type: integer
        autonomousActions:
          type: integer
        acceptedInquiries:
          type: integer
        customerReplies:
          type: integer
        quotedValue:
          type: number
        acceptedValue:
          type: number
      required: [totalInquiries, escalatedInquiries, resolvedInquiries, solutionPatterns, autonomousActions, acceptedInquiries, customerReplies, quotedValue, acceptedValue]
    VantageSyncResult:
      type: object
      properties:
        scanned:
          type: integer
        imported:
          type: integer
        alreadySeen:
          type: integer
        processed:
          type: integer
        awaitingGrok:
          type: integer
        repliesLinked:
          type: integer
        autoAccepted:
          type: integer
        autoDeclined:
          type: integer
        inquiries:
          type: array
          items:
            $ref: "#/components/schemas/VantageInquiry"
        message:
          type: string
      required: [scanned, imported, alreadySeen, processed, awaitingGrok, repliesLinked, autoAccepted, autoDeclined, inquiries, message]
    VantageAutomationSettings:
      type: object
      properties:
        enabled:
          type: boolean
        pausedByOwner:
          type: boolean
        autonomousSendingEnabled:
          type: boolean
        intervalMinutes:
          type: integer
        matchingQuery:
          type: string
        providerReady:
          type: boolean
        bankDetailsConfigured:
          type: boolean
        schedulingUrl:
          type: string
        notificationWebhookUrl:
          type: string
        notificationWebhookSecretConfigured:
          type: boolean
        slaHours:
          type: integer
        followUpDays:
          type: integer
        archiveDays:
          type: integer
        lastCycleSteps:
          type: array
          items:
            $ref: "#/components/schemas/VantageAutonomousStep"
        lastRunAt:
          type: [string, "null"]
      required: [enabled, pausedByOwner, autonomousSendingEnabled, intervalMinutes, matchingQuery, providerReady, bankDetailsConfigured, schedulingUrl, notificationWebhookUrl, notificationWebhookSecretConfigured, slaHours, followUpDays, archiveDays, lastCycleSteps, lastRunAt]
    VantageAutomationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed, failed]
        message:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/VantageAutonomousStep"
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      required: [id, status, message, steps, startedAt, completedAt]
    VantageAutonomousStep:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        message:
          type: string
      required: [key, label, message]
    VantageAutonomyPolicyInput:
      type: object
      properties:
        schedulingUrl:
          type: string
        notificationWebhookUrl:
          type: string
        notificationWebhookSecret:
          type: string
        clearWebhookSecret:
          type: boolean
        slaHours:
          type: integer
          minimum: 1
          maximum: 168
        followUpDays:
          type: integer
          minimum: 1
          maximum: 90
        archiveDays:
          type: integer
          minimum: 7
          maximum: 365
      required: [slaHours, followUpDays, archiveDays]
    VantageAutomationInput:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]
    VantageCrmSyncResult:
      type: object
      properties:
        status:
          type: string
          enum: [synced, needs_attention]
        contactId:
          type: [string, "null"]
        message:
          type: string
      required: [status, contactId, message]
    VantageBankDetails:
      type: object
      properties:
        accountName:
          type: string
          minLength: 1
        bankName:
          type: string
          minLength: 1
        accountNumber:
          type: string
          minLength: 3
        branchCode:
          type: string
          minLength: 3
        accountType:
          type: string
          minLength: 1
      required: [accountName, bankName, accountNumber, branchCode, accountType]
    VantageQuotePreviewInput:
      type: object
      properties:
        bankDetails:
          $ref: "#/components/schemas/VantageBankDetails"
      required: [bankDetails]
    VantageQuotePreview:
