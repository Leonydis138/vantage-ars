openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Vantage ARS operations and approval API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vantage-ars
    description: Owner-approved Vantage ARS operations using connected live services
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /vantage-ars/dashboard:
    get:
      operationId: getVantageArsDashboard
      tags: [vantage-ars]
      summary: Read live service health and operational counts
      responses:
        "200":
          description: Dashboard status from connected services and persisted records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/inquiries:
    get:
      operationId: listVantageArsInquiries
      tags: [vantage-ars]
      summary: List real enquiries imported from Gmail
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, needs_review, needs_information, quote_ready, quote_sent, declined]
            default: all
      responses:
        "200":
          description: Persisted enquiries and any generated quote proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VantageInquiry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/inquiries/sync:
    post:
      operationId: syncVantageArsInquiries
      tags: [vantage-ars]
      summary: Read matching live Gmail messages and process them with Grok
      description: >
        Imports only matching inbox messages. It never sends email, creates a
        Gmail draft, or publishes content.
      responses:
        "200":
          description: Live Gmail sync and AI processing results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageSyncResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: A connected provider returned an error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/automation:
    get:
      operationId: getVantageArsAutomation
      tags: [vantage-ars]
      summary: Read automated inbox processing settings
      responses:
        "200":
          description: Current processing preference and polling interval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageAutomationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: setVantageArsAutomation
      tags: [vantage-ars]
      summary: Enable or pause automated inbox processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VantageAutomationInput"
      responses:
        "200":
          description: Updated processing preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageAutomationSettings"
        "400":
          description: Grok or Gmail is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /vantage-ars/inquiries/{inquiryId}/crm-sync:
    post:
      operationId: syncVantageArsInquiryToHubSpot
      tags: [vantage-ars]
      summary: Retry the approved inquiry contact sync to HubSpot
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: HubSpot contact sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageCrmSyncResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "502":
          description: HubSpot could not confirm the contact update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/inquiries/{inquiryId}/preview:
    post:
      operationId: previewVantageArsQuote
      tags: [vantage-ars]
      summary: Preview the exact quote email without sending it
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VantageQuotePreviewInput"
      responses:
        "200":
          description: Exact recipient, subject, and rendered message for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageQuotePreview"
        "400":
          description: Quote is not ready or banking information is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
  /vantage-ars/inquiries/{inquiryId}/decision:
    post:
      operationId: decideVantageArsQuote
      tags: [vantage-ars]
      summary: Approve and send, or decline, an AI-prepared quote
      description: >
        An approval sends the quote to the inquiry's stored sender address
        through Gmail. Bank details are accepted for this request only and are
        never persisted by the application.
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VantageQuoteDecisionInput"
      responses:
        "200":
          description: Quote decision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageQuoteDecisionResult"
        "400":
          description: Quote is incomplete or not eligible for the requested action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Enquiry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
        "502":
          description: Gmail could not confirm the send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VantageError"
components:
  responses:
    Unauthorized:
      description: Sign-in required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VantageError"
    Forbidden:
      description: This account is not the connected business mailbox owner
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VantageError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VantageServiceStatus:
      type: object
      properties:
        id:
          type: string
          enum: [gmail, grok, hubspot, cloudflare, phone, facebook, linkedin]
        label:
          type: string
        status:
          type: string
          enum: [connected, attention, not_connected, setup_required]
        detail:
          type: string
      required: [id, label, status, detail]
    VantageDashboard:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/VantageServiceStatus"
        counts:
          type: object
          properties:
            needsReview:
              type: integer
            needsInformation:
              type: integer
            quotesReady:
              type: integer
            quotesSent:
              type: integer
            crmSyncNeeded:
              type: integer
          required: [needsReview, needsInformation, quotesReady, quotesSent, crmSyncNeeded]
        lastSyncAt:
          type: [string, "null"]
          format: date-time
        rateSourceUrl:
          type: string
      required: [services, counts, lastSyncAt, rateSourceUrl]
    VantageRateLine:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitPrice:
          type: number
        total:
          type: number
      required: [code, description, quantity, unit, unitPrice, total]
    VantageQuote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        status:
          type: string
          enum: [ready, sending, sent, declined, send_uncertain]
        currency:
          type: string
          enum: [ZAR]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/VantageRateLine"
        subtotal:
          type: number
        notes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: [string, "null"]
      required: [id, reference, status, currency, lines, subtotal, notes, createdAt, sentAt]
    VantageInquiry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
        subject:
          type: string
        receivedAt:
          type: string
          format: date-time
        summary:
          type: [string, "null"]
        category:
          type: [string, "null"]
        urgency:
          type: [string, "null"]
        status:
          type: string
          enum: [processing, needs_review, needs_information, quote_ready, quote_sent, declined, not_relevant]
        missingInformation:
          type: array
          items:
            type: string
        messageBody:
          type: string
        hasAttachments:
          type: boolean
        hubspotContactId:
          type: [string, "null"]
        hubspotSyncStatus:
          type: string
          enum: [not_requested, awaiting_approval, synced, needs_attention]
        quote:
          oneOf:
            - $ref: "#/components/schemas/VantageQuote"
            - type: "null"
      required:
        [id, customerName, customerEmail, subject, receivedAt, summary, category, urgency, status, missingInformation, messageBody, hasAttachments, hubspotContactId, hubspotSyncStatus, quote]
    VantageSyncResult:
      type: object
      properties:
        scanned:
          type: integer
        imported:
          type: integer
        alreadySeen:
          type: integer
        processed:
          type: integer
        awaitingGrok:
          type: integer
        inquiries:
          type: array
          items:
            $ref: "#/components/schemas/VantageInquiry"
        message:
          type: string
      required: [scanned, imported, alreadySeen, processed, awaitingGrok, inquiries, message]
    VantageAutomationSettings:
      type: object
      properties:
        enabled:
          type: boolean
        intervalMinutes:
          type: integer
        matchingQuery:
          type: string
        providerReady:
          type: boolean
        lastRunAt:
          type: [string, "null"]
      required: [enabled, intervalMinutes, matchingQuery, providerReady, lastRunAt]
    VantageAutomationInput:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]
    VantageCrmSyncResult:
      type: object
      properties:
        status:
          type: string
          enum: [synced, needs_attention]
        contactId:
          type: [string, "null"]
        message:
          type: string
      required: [status, contactId, message]
    VantageBankDetails:
      type: object
      properties:
        accountName:
          type: string
          minLength: 1
        bankName:
          type: string
          minLength: 1
        accountNumber:
          type: string
          minLength: 3
        branchCode:
          type: string
          minLength: 3
        accountType:
          type: string
          minLength: 1
      required: [accountName, bankName, accountNumber, branchCode, accountType]
    VantageQuotePreviewInput:
      type: object
      properties:
        bankDetails:
          $ref: "#/components/schemas/VantageBankDetails"
      required: [bankDetails]
    VantageQuotePreview:
      type: object
      properties:
        recipientEmail:
          type: string
          format: email
        subject:
          type: string
        plainTextBody:
          type: string
        plannedActions:
          type: array
          items:
            type: string
      required: [recipientEmail, subject, plainTextBody, plannedActions]
    VantageQuoteDecisionInput:
      type: object
      properties:
        decision:
          type: string
          enum: [approve, decline]
        bankDetails:
          $ref: "#/components/schemas/VantageBankDetails"
      required: [decision]
    VantageQuoteDecisionResult:
      type: object
      properties:
        inquiry:
          $ref: "#/components/schemas/VantageInquiry"
        message:
          type: string
      required: [inquiry, message]
    VantageError:
      type: object
      properties:
        error:
          type: string
      required: [error]

