kind = "web"
previewPath = "/"
title = "Vantage ARS Operations"
description = "A private operations workspace for Vantage ARS. Reads real customer enquiries from Gmail, prepares AI-assisted triage and written quotes from verified business rates, and holds every external or paid action for explicit approval. It uses no seeded leads or simulated activity."
version = "1.0.0"
id = "artifacts/vantage-ars-ops"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19837

[services.development]
run = "pnpm --filter @workspace/vantage-ars-ops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vantage-ars-ops", "run", "build" ]
serve = "static"
publicDir = "artifacts/vantage-ars-ops/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19837"
BASE_PATH = "/"
